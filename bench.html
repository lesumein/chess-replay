<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분석 속도 재기</title>
<style>
  :root {
    --bg: #faf8f4; --fg: #1f1d1a; --muted: #6b665e; --line: #e2ddd3;
    --card: #ffffff; --accent: #2f6b4f; --accent-fg: #ffffff; --warn: #a3471f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --fg: #ece8e1; --muted: #a39d93; --line: #2e2b27;
      --card: #1f1d1a; --accent: #6fb38f; --accent-fg: #10140f; --warn: #e08a62;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --fg: #ece8e1; --muted: #a39d93; --line: #2e2b27;
    --card: #1f1d1a; --accent: #6fb38f; --accent-fg: #10140f; --warn: #e08a62;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  form { display: flex; gap: 8px; }
  input, select { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 16px; margin: 14px 0; flex-wrap: wrap; }
  .row label { display: flex; gap: 6px; align-items: center; }
  section { margin-top: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 10px; }
  .status { color: var(--muted); min-height: 1.5em; margin-top: 12px; }
  .error { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  ul.scenes { list-style: none; padding: 0; margin: 0; }
  ul.scenes li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tag { font-size: .8rem; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; margin-right: 6px; }
  .tag.missed { color: var(--accent); }
  .tag.blunder { color: var(--warn); }
  .small { font-size: .85rem; color: var(--muted); }
  footer { margin-top: 32px; font-size: .8rem; color: var(--muted); }
  footer a { color: inherit; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: .8rem; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>분석 속도 재기</h1>
  <p class="sub">끝난 게임 한 판을 이 기기에서 Stockfish로 분석하는 데 몇 초 걸리는지 잽니다.</p>

  <form id="idForm">
    <input id="user" name="user" placeholder="Chess.com 아이디" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <button id="fetchBtn">가져오기</button>
  </form>

  <div id="pick" hidden>
    <div class="row"><select id="game"></select></div>
    <div class="row">
      <label><input type="checkbox" name="depth" value="10"> 깊이 10</label>
      <label><input type="checkbox" name="depth" value="12" checked> 12</label>
      <label><input type="checkbox" name="depth" value="16" checked> 16</label>
      <label><input type="checkbox" name="depth" value="20"> 20</label>
    </div>
    <button id="runBtn">재기</button>
  </div>

  <div id="status" class="status" role="status"></div>
  <div id="result"></div>

  <footer>
    분석 엔진: Stockfish (GPL v3), 소스: <a href="https://github.com/official-stockfish/Stockfish">github.com/official-stockfish/Stockfish</a>
    · WASM 빌드: <a href="https://github.com/nmrugg/stockfish.js">github.com/nmrugg/stockfish.js</a>
    · 라이선스 전문: <a href="stockfish/COPYING">stockfish/COPYING</a>
  </footer>
</main>

<script type="module">
import { Engine } from './src/engine.js';
import { parsePgn, addTimeSpent } from './src/pgn.js';
import { replay, evaluateAll, findScenes } from './src/analyze.js';

const API = 'https://api.chess.com/pub/player';
const $ = (id) => document.getElementById(id);
const status = (text, error = false) => { $('status').textContent = text; $('status').className = 'status' + (error ? ' error' : ''); };
const sec = (ms) => (ms / 1000).toFixed(1) + '초';
const pawns = (c) => (c >= 1000 ? '메이트' : c <= -1000 ? '메이트 당함' : (c > 0 ? '+' : '') + (c / 100).toFixed(1));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let games = [];
let user = '';

try { $('user').value = localStorage.getItem('user') || ''; } catch {}

async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status === 404 ? '아이디를 찾지 못했어요.' : `불러오지 못했어요 (${res.status}).`);
  return res.json();
}

// 아카이브에는 끝난 게임만 있다. 진행 중인 게임은 여기서 가져오지 않는다.
async function fetchRecentGames(name, want = 10) {
  const { archives } = await getJson(`${API}/${encodeURIComponent(name)}/games/archives`);
  const found = [];
  for (const url of [...archives].reverse()) {
    const { games } = await getJson(url);
    const ok = games.filter((g) => g.rules === 'chess' && g.pgn && !/\[Result "\*"\]/.test(g.pgn));
    found.push(...ok.sort((a, b) => b.end_time - a.end_time));
    if (found.length >= want) break;
  }
  return found.slice(0, want);
}

function label(g) {
  const me = g.white.username.toLowerCase() === user.toLowerCase() ? 'white' : 'black';
  const opp = me === 'white' ? g.black : g.white;
  const res = g[me].result === 'win' ? '승' : ['agreed', 'repetition', 'stalemate', 'insufficient', '50move', 'timevsinsufficient'].includes(g[me].result) ? '무' : '패';
  const date = new Date(g.end_time * 1000).toLocaleDateString('ko-KR');
  return `${date} · ${g.time_class} · ${me === 'white' ? '백' : '흑'} · ${res} · vs ${opp.username}`;
}

$('idForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  user = $('user').value.trim();
  try { localStorage.setItem('user', user); } catch {}
  $('fetchBtn').disabled = true;
  $('pick').hidden = true;
  $('result').innerHTML = '';
  status('게임을 가져오는 중…');
  try {
    games = await fetchRecentGames(user);
    if (!games.length) throw new Error('끝난 게임이 없어요.');
    $('game').innerHTML = games.map((g, i) => `<option value="${i}">${esc(label(g))}</option>`).join('');
    $('pick').hidden = false;
    status(`최근 게임 ${games.length}판을 가져왔어요.`);
  } catch (err) {
    status(err.message, true);
  } finally {
    $('fetchBtn').disabled = false;
  }
});

$('runBtn').addEventListener('click', async () => {
  const g = games[$('game').value];
  const depths = [...document.querySelectorAll('input[name=depth]:checked')].map((x) => +x.value);
  if (!depths.length) return status('깊이를 하나 이상 고르세요.', true);
  $('runBtn').disabled = true;
  $('result').innerHTML = '';
  const engine = new Engine('stockfish/stockfish-18-lite-single.js');
  try {
    let t = performance.now();
    status('엔진을 불러오는 중…');
    await engine.init();
    const loadMs = performance.now() - t;

    const { headers, moves } = parsePgn(g.pgn);
    addTimeSpent(moves, headers.TimeControl);
    t = performance.now();
    const positions = await replay(engine, moves, headers.SetUp === '1' ? headers.FEN : undefined);
    const replayMs = performance.now() - t;
    const side = headers.White.toLowerCase() === user.toLowerCase() ? 0 : 1;

    const runs = [];
    for (const depth of depths) {
      const { evals, ms } = await evaluateAll(engine, positions, depth, (i, n) => status(`깊이 ${depth} 분석 중… ${i}/${n}`));
      const scenes = await findScenes(engine, positions, evals, side);
      const slowest = Math.max(...evals.map((e) => e.ms));
      runs.push({ depth, ms, perPos: ms / positions.length, slowest, scenes });
    }
    status('끝났어요.');
    render(g, moves.length, positions.length, loadMs, replayMs, runs);
  } catch (err) {
    status(err.message, true);
  } finally {
    engine.terminate();
    $('runBtn').disabled = false;
  }
});

function render(g, plies, positions, loadMs, replayMs, runs) {
  const rows = runs.map((r) => `<tr><td>깊이 ${r.depth}</td><td class="num">${sec(r.ms)}</td><td class="num">${Math.round(r.perPos)}ms</td><td class="num">${Math.round(r.slowest)}ms</td><td class="num">${r.scenes.length}</td></tr>`).join('');
  const last = runs.at(-1);
  const scenes = last.scenes.map((s) => `<li>
      <span class="tag ${s.kind}">${s.kind === 'missed' ? '놓친 기회' : '큰 실수'}</span>
      <b>${s.moveNo}${s.side ? '...' : '.'}${esc(s.played)}</b> → ${esc(s.best)}
      <div class="small">${s.mate ? `${s.mate}수 메이트` : pawns(s.before)} → ${pawns(s.after)}${s.spent != null ? ` · 이 수에 ${s.spent.toFixed(1)}초` : ''}</div>
    </li>`).join('');
  const summary = [
    `기기: ${navigator.userAgent}`,
    `코어: ${navigator.hardwareConcurrency ?? '?'}`,
    `게임: ${g.url} (${Math.ceil(plies / 2)}수)`,
    `엔진 로드 ${sec(loadMs)}, 기보 따라가기 ${sec(replayMs)}`,
    ...runs.map((r) => `깊이 ${r.depth}: ${sec(r.ms)} (포지션당 ${Math.round(r.perPos)}ms, 최대 ${Math.round(r.slowest)}ms), 장면 ${r.scenes.length}개: ${r.scenes.map((s) => `${s.moveNo}${s.side ? '...' : '.'}${s.played}(${s.best})`).join(' ')}`),
  ].join('\n');
  $('result').innerHTML = `
    <section class="card">
      <div class="small">${esc(label(g))} · ${Math.ceil(plies / 2)}수 · 포지션 ${positions}개</div>
      <div class="small">엔진 로드 ${sec(loadMs)} · 기보 따라가기 ${sec(replayMs)}</div>
      <table id="timing">
        <thead><tr><th></th><th class="num">전체</th><th class="num">평균</th><th class="num">최대</th><th class="num">장면</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>
    <section class="card">
      <div class="small">깊이 ${last.depth}에서 찾은 장면</div>
      ${scenes ? `<ul class="scenes" id="scenes">${scenes}</ul>` : '<p>큰 실수나 놓친 기회가 없었어요.</p>'}
    </section>
    <section class="card">
      <div class="row" style="margin-top:0"><button id="copyBtn" type="button">결과 복사</button></div>
      <pre id="summary">${esc(summary)}</pre>
    </section>`;
  $('copyBtn').onclick = () => navigator.clipboard?.writeText(summary).then(() => status('복사했어요.'), () => status('복사하지 못했어요. 아래 글을 직접 복사하세요.', true));
}
</script>
</body>
</html>
