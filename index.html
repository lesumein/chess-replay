<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다시 두기</title>
<link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/arrows/arrows.css">
<style>
  :root {
    --bg: #faf8f4; --fg: #1f1d1a; --muted: #6b665e; --line: #e2ddd3; --card: #ffffff;
    --accent: #2f6b4f; --accent-fg: #ffffff; --warn: #a3471f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --fg: #ece8e1; --muted: #a39d93; --line: #2e2b27; --card: #1f1d1a;
      --accent: #6fb38f; --accent-fg: #10140f; --warn: #e08a62;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --fg: #ece8e1; --muted: #a39d93; --line: #2e2b27; --card: #1f1d1a;
    --accent: #6fb38f; --accent-fg: #10140f; --warn: #e08a62;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 1.25rem; margin: 8px 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .92rem; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 0; font-weight: 400; }
  .big { width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stats b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .stats span { font-size: .8rem; color: var(--muted); }
  .note { color: var(--muted); font-size: .88rem; min-height: 1.4em; margin-top: 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px; font-size: .95rem; }
  .bar .who { font-weight: 600; }
  .bar .side { color: var(--muted); font-size: .85rem; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; padding: 2px 10px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); }
  .clock.low { color: var(--warn); border-color: var(--warn); }
  #board { width: 100%; aspect-ratio: 1; }
  #board[data-active="true"] { cursor: pointer; }
  .turn { min-height: 1.5em; color: var(--muted); font-size: .9rem; text-align: center; margin-top: 8px; }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 12px; }
  .result p { margin: 0 0 12px; font-size: 1.05rem; }
  .result .actions { display: flex; gap: 12px; align-items: center; }
  .result a { color: var(--muted); font-size: .85rem; margin-left: auto; }
  .legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin: -4px 0 12px; }
  .legend .key { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-left: 6px; }
  .legend .key.good { background: #2e8b57; margin-left: 0; }
  .legend .key.bad { background: #c0392b; }
  .legend button { margin-left: auto; padding: 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  footer { margin-top: 28px; font-size: .78rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <section id="setup" hidden>
    <h1>다시 두기</h1>
    <p class="sub">Chess.com에서 끝난 내 게임을 이 폰에서 분석해, 놓친 장면 몇 수 전부터 다시 둡니다. 어디가 그 장면인지는 알려 주지 않아요.</p>
    <form id="setupForm">
      <input id="user" placeholder="Chess.com 아이디" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button>시작</button>
    </form>
  </section>

  <section id="home" hidden>
    <div class="top">
      <h1>다시 두기</h1>
      <button class="ghost" id="changeUser" type="button">아이디 바꾸기</button>
    </div>
    <div class="stats" id="stats"></div>
    <button class="big" id="playBtn" type="button" disabled>두기</button>
    <div class="note" id="note" role="status"></div>
  </section>

  <section id="play" hidden>
    <div class="top">
      <span class="side" id="gameInfo"></span>
      <button class="ghost" id="quitBtn" type="button">그만</button>
    </div>
    <div class="bar"><span class="who" id="opp"></span></div>
    <div id="board"></div>
    <div class="bar"><span class="who" id="me"></span><span class="clock" id="clock">0:00</span></div>
    <div class="turn" id="turn"></div>
    <div class="result" id="result" hidden>
      <p id="resultText"></p>
      <div class="legend" id="legend"><span class="key good"></span>좋은 수 <span id="legendBad"><span class="key bad"></span>둔 수</span> <button class="ghost" id="toggleView" type="button"></button></div>
      <div class="actions">
        <button id="nextBtn" type="button">다음</button>
        <button class="ghost" id="homeBtn" type="button">처음으로</button>
        <a id="resultLink" target="_blank" rel="noopener">원래 게임</a>
      </div>
    </div>
  </section>

  <footer>
    분석·상대: Stockfish (GPL v3), 소스: <a href="https://github.com/official-stockfish/Stockfish">github.com/official-stockfish/Stockfish</a>
    · <a href="stockfish/COPYING">라이선스 전문</a>
    · 판: <a href="https://github.com/shaack/cm-chessboard">cm-chessboard</a> (MIT)
    · 기물: <a href="https://commons.wikimedia.org/wiki/Category:SVG_chess_pieces/Standard">Wikimedia Commons</a>, Cburnett·Rfc1394 (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>) · <a href="bench.html">분석 속도 재기</a>
  </footer>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
